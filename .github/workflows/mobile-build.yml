name: YAVIYA Mobile build
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build for internal testing
        type: choice
        options: [android, ios, all]
        default: android
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install and validate
        run: |
          npm ci
          npm run typecheck
          npx expo lint
          node --test tests/*.test.mjs
      - name: Check EAS project is linked
        run: |
          node -e "const id=require('./app.json').expo.extra?.eas?.projectId; if(!id) { console.error('Initialize the Expo project with eas init and commit the generated projectId before building.'); process.exit(1); }"
      - name: Set up Expo
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build signed internal application
        env:
          BUILD_PLATFORM: ${{ inputs.platform }}
        run: eas build --platform "$BUILD_PLATFORM" --profile preview --non-interactive
