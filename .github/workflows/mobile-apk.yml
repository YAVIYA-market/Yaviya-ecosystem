name: YAVIYA Android APK interne
on:
  workflow_dispatch:
  push:
    branches: [migration/nextjs]
    paths:
      - mobile/app.json
      - mobile/app.config.js
      - mobile/eas.json
      - mobile/scripts/prepare-eas-build.mjs
      - .github/workflows/mobile-apk.yml
permissions:
  contents: read
concurrency:
  group: yaviya-apk-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      EAS_OWNER: ${{ vars.EAS_OWNER }}
      EXPO_PUBLIC_API_URL: ${{ vars.MOBILE_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Vérifier les prérequis Expo et le backend
        id: configuration
        run: node scripts/prepare-eas-build.mjs
      - name: Installer et vérifier l’application
        if: steps.configuration.outputs.ready == 'true'
        run: npm ci && npm run typecheck && npm run lint
      - name: Connecter Expo
        if: steps.configuration.outputs.ready == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Compiler l’APK signé pour distribution interne
        if: steps.configuration.outputs.ready == 'true'
        run: eas build --platform android --profile preview --non-interactive --wait --json > build-result.json
      - name: Conserver le résultat et le lien de téléchargement
        if: steps.configuration.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: yaviya-android-build-result
          path: mobile/build-result.json
          retention-days: 14
